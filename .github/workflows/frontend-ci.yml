name: Verdaxis Frontend CI

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Test release guards
        run: |
          npm run test:artifact-check
          npm run test:release-smoke

      - name: Typecheck
        run: npm run typecheck

      - name: Check translations
        run: npm run i18n:check

      - name: Build staging bundle
        run: npm run build:staging

      - name: Check staging artifact
        run: npm run build:check:staging

      - name: Build production bundle
        run: npm run build:prod

      - name: Check production artifact
        run: npm run build:check:prod
