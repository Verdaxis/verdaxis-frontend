# Live branches are staging/prod.
# Deploys are operator-run on the VPS via scripts/deploy.sh + rsync.
# See CLAUDE.md.

name: Verdaxis Frontend CI

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Check Phase 0 request classifications
        run: node --test scripts/phase0-request-manifest.test.mjs

      - name: Check artifact and release helpers offline
        run: |
          npm run test:artifact-check
          npm run test:release-smoke

      - name: Typecheck (TypeScript 7 native)
        run: npm run typecheck

      - name: Check translations
        run: npm run i18n:check

      - name: Build staging bundle
        run: npm run build:staging

      - name: Check staging artifacts
        run: npm run build:check:staging

      - name: Build production bundle
        run: npm run build:prod

      - name: Check build artifacts
        run: npm run build:check
