<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/verdaxis-favicon-64.png" type="image/png" sizes="64x64" />
    <!-- route-metadata:start -->
    <title>Verdaxis</title>
    <meta name="description" content="Verdaxis low-carbon fuel market platform." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta property="og:site_name" content="Verdaxis" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Verdaxis" />
    <meta property="og:description" content="Verdaxis low-carbon fuel market platform." />
    <meta property="og:locale" content="en_SG" />
    <meta property="og:image" content="https://verdaxis.exchange/verdaxis-social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Verdaxis — Low Carbon Fuels Exchange" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verdaxis" />
    <meta name="twitter:description" content="Verdaxis low-carbon fuel market platform." />
    <meta name="twitter:image" content="https://verdaxis.exchange/verdaxis-social-card.png" />
    <meta name="twitter:image:alt" content="Verdaxis — Low Carbon Fuels Exchange" />
    <!-- route-metadata:end -->
    <link rel="stylesheet" href="/src/loading-screen.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Lato", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Montserrat", sans-serif;
      }
      /* Leaflet Map Container Override */
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
        z-index: 0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* Marker Animations */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }

      .pulse-green {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-amber {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-red {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      .marker-animated .group-hover\:scale-110:hover {
        transform: scale(1.1);
      }

      /* Route Animation */
      @keyframes flow {
        to {
          stroke-dashoffset: -200;
        }
      }

      .animated-route {
        animation: flow 5s linear infinite;
      }

      /* Popup styling that respects theme */
      .leaflet-popup-content-wrapper {
        background: var(--bg-card) !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }
      .leaflet-popup-tip {
        background: var(--bg-card) !important;
        border: 1px solid var(--border-color);
      }

      /* Aggressive fix for popup clipping */
      .leaflet-popup-content-wrapper {
        overflow: visible !important;
      }
      .leaflet-popup-content {
        margin: 0 !important;
        width: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      .verdaxis-popup .leaflet-popup-content-wrapper {
        padding: 0;
        overflow: visible !important;
        background: var(--bg-card) !important;
      }
      .verdaxis-popup .leaflet-popup-content {
        padding: 12px;
        overflow: visible !important;
      }

    </style>
  </head>
  <body
    class="bg-verdaxis-light text-verdaxis-dark antialiased h-screen overflow-hidden"
  >
    <div id="root">
      <div class="loading-screen loading-screen--fullscreen" role="status" aria-live="polite">
        <img class="loading-screen__mark" src="/loading-fuel.svg" width="96" height="112" alt="" aria-hidden="true" />
        <p class="loading-screen__label">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
