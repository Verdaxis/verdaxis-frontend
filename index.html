<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://marinachain-image-hosting.s3.ap-southeast-1.amazonaws.com/miscellaneous/verdaxis_logo_no_words.png"
    />
    <title>Verdaxis Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              verdaxis: {
                DEFAULT: "#5DADE2", // Brand Blue
                dark: "var(--text-primary)", // Mapped to primary text color (Slate 700 / Slate 50)
                green: "#4CAF50", // Success Green
                light: "var(--bg-primary)", // Mapped to primary background (Slate 50 / Slate 900)
                // New semantic colors
                bg: "var(--bg-primary)",
                card: "var(--bg-card)",
                text: "var(--text-primary)",
                border: "var(--border-color)",
                input: "var(--input-bg)",
                "text-muted": "var(--text-secondary)",
              },
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer components {
        /* Common Card Style */
        .v-card {
          @apply bg-verdaxis-card rounded-xl shadow-sm border border-verdaxis-border transition-colors duration-200;
        }

        /* Brand Heading */
        .v-heading {
          @apply font-['Montserrat'] font-bold text-verdaxis-text transition-colors duration-200;
        }

        /* Form Label */
        .v-label {
          @apply block text-xs font-bold text-verdaxis-text-muted uppercase tracking-wider mb-2 transition-colors duration-200;
        }

        /* Standard Input */
        .v-input {
          @apply w-full px-4 py-3 bg-verdaxis-input border border-verdaxis-border rounded-lg focus:ring-2 focus:ring-[#5DADE2] focus:outline-none font-medium text-verdaxis-text transition-colors duration-200;
        }

        /* Primary Button */
        .v-btn-primary {
          @apply bg-[#334155] dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center space-x-2;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Lato", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Montserrat", sans-serif;
      }
      /* Leaflet Map Container Override */
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
        z-index: 0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* Marker Animations */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }

      .pulse-green {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-amber {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-red {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      .marker-animated .group-hover\:scale-110:hover {
        transform: scale(1.1);
      }

      /* Route Animation */
      @keyframes flow {
        to {
          stroke-dashoffset: -200;
        }
      }

      .animated-route {
        animation: flow 5s linear infinite;
      }

      /* Popup styling that respects theme */
      .leaflet-popup-content-wrapper {
        background: var(--bg-card) !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }
      .leaflet-popup-tip {
        background: var(--bg-card) !important;
        border: 1px solid var(--border-color);
      }

      /* Aggressive fix for popup clipping */
      .leaflet-popup-content-wrapper {
        overflow: visible !important;
      }
      .leaflet-popup-content {
        margin: 0 !important;
        width: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      .verdaxis-popup .leaflet-popup-content-wrapper {
        padding: 0;
        overflow: visible !important;
        background: var(--bg-card) !important;
      }
      .verdaxis-popup .leaflet-popup-content {
        padding: 12px;
        overflow: visible !important;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "leaflet": "https://aistudiocdn.com/leaflet@^1.9.4",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-leaflet": "https://aistudiocdn.com/react-leaflet@^5.0.0",
          "react-dom/server": "https://aistudiocdn.com/react-dom@^19.2.0/server",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
        }
      }
    </script>
  </head>
  <body
    class="bg-verdaxis-light text-verdaxis-dark antialiased h-screen overflow-hidden"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
