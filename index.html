<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/verdaxis-logo-no-words.png"
    />
    <title>Verdaxis Intelligence</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lato:wght@300;400;700&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Lato", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Montserrat", sans-serif;
      }
      /* Leaflet Map Container Override */
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
        z-index: 0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* Marker Animations */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }

      .pulse-green {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-amber {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-red {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      .marker-animated .group-hover\:scale-110:hover {
        transform: scale(1.1);
      }

      /* Route Animation */
      @keyframes flow {
        to {
          stroke-dashoffset: -200;
        }
      }

      .animated-route {
        animation: flow 5s linear infinite;
      }

      /* Popup styling that respects theme */
      .leaflet-popup-content-wrapper {
        background: var(--bg-card) !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }
      .leaflet-popup-tip {
        background: var(--bg-card) !important;
        border: 1px solid var(--border-color);
      }

      /* Aggressive fix for popup clipping */
      .leaflet-popup-content-wrapper {
        overflow: visible !important;
      }
      .leaflet-popup-content {
        margin: 0 !important;
        width: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      .verdaxis-popup .leaflet-popup-content-wrapper {
        padding: 0;
        overflow: visible !important;
        background: var(--bg-card) !important;
      }
      .verdaxis-popup .leaflet-popup-content {
        padding: 12px;
        overflow: visible !important;
      }

      .initial-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
      }
      .initial-shell__panel {
        width: min(360px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .initial-shell__logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      .initial-shell__title {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        font-size: 18px;
        font-weight: 700;
      }
      .initial-shell__copy {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
      }
      .initial-shell__bar {
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .initial-shell__bar::after {
        content: "";
        display: block;
        width: 56px;
        height: 100%;
        border-radius: inherit;
        background: #22c55e;
        animation: initial-shell-progress 1.1s ease-in-out infinite;
      }
      @keyframes initial-shell-progress {
        0% {
          transform: translateX(-64px);
        }
        100% {
          transform: translateX(168px);
        }
      }
    </style>
  </head>
  <body
    class="bg-verdaxis-light text-verdaxis-dark antialiased h-screen overflow-hidden"
  >
    <div id="root">
      <div class="initial-shell" role="status" aria-live="polite">
        <div class="initial-shell__panel">
          <img
            class="initial-shell__logo"
            src="/verdaxis-logo-no-words.png"
            alt="Verdaxis"
          />
          <p class="initial-shell__title">Loading Verdaxis</p>
          <p class="initial-shell__copy">
            Preparing the low-carbon fuels exchange.
          </p>
          <div class="initial-shell__bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
